<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 에스텍 안전보건 관리 시스템 앱 아이콘 — 에스텍 프로그램 공통 아이콘 형식(남색 타일 · 은색 테두리 · S-Tec 로고 · 한글/영문 이름) · Designed by Rat Rae Choi -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A3A7A"/><stop offset=".55" stop-color="#0C2350"/><stop offset="1" stop-color="#071433"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F6FA"/><stop offset=".45" stop-color="#9AA3B2"/><stop offset=".7" stop-color="#E6E9EF"/><stop offset="1" stop-color="#7C8596"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34C25C"/><stop offset="1" stop-color="#147A33"/></linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD84A"/><stop offset="1" stop-color="#F29A0E"/></linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3DDC6A"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".5"><stop offset="0" stop-color="#3B6BE0" stop-opacity=".55"/><stop offset="1" stop-color="#3B6BE0" stop-opacity="0"/></radialGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect x="18" y="18" width="988" height="988" rx="190" fill="url(#rim)"/>
  <rect x="40" y="40" width="944" height="944" rx="172" fill="url(#bg)"/>
  <rect x="40" y="40" width="944" height="944" rx="172" fill="url(#glow)"/>
  <!-- S-Tec 로고 -->
  <g transform="translate(512 168)" font-family="Arial Black, Arial, sans-serif" font-style="italic" font-weight="900" text-anchor="middle">
    <path d="M-235 18 h-60 l20 -22 h60z M-250 44 h-70 l20 -22 h70z" fill="#3DDC6A"/>
    <text x="10" y="40" font-size="128" fill="url(#logo)" stroke="#0B1F8A" stroke-width="3" letter-spacing="-4">S-Tec</text>
  </g>
  <!-- 가운데 상징: 방패 + 안전모 + 체크 + 점검표 -->
  <g filter="url(#ds)">
    <!-- 점검표(왼쪽) -->
    <g transform="translate(205 395) rotate(-8)">
      <rect x="0" y="0" width="190" height="240" rx="18" fill="#F4F6FA" stroke="#C9CDD3" stroke-width="6"/>
      <rect x="55" y="-18" width="80" height="34" rx="10" fill="#9AA3B2"/>
      <g stroke-linecap="round" stroke-width="12">
        <path d="M28 60 l14 14 l24 -28" stroke="#1E8B3A" fill="none"/><path d="M84 62 h80" stroke="#9AA3B2"/>
        <path d="M28 120 l14 14 l24 -28" stroke="#1E8B3A" fill="none"/><path d="M84 122 h80" stroke="#9AA3B2"/>
        <path d="M28 180 l14 14 l24 -28" stroke="#E8750A" fill="none"/><path d="M84 182 h64" stroke="#9AA3B2"/>
      </g>
    </g>
    <!-- 경고 표지(오른쪽) -->
    <g transform="translate(690 420)">
      <path d="M70 0 L140 128 H0 Z" fill="#FFC62E" stroke="#1C2333" stroke-width="10" stroke-linejoin="round"/>
      <rect x="62" y="40" width="16" height="52" rx="7" fill="#1C2333"/><circle cx="70" cy="108" r="9" fill="#1C2333"/>
    </g>
    <!-- 방패 -->
    <path d="M512 300 L700 360 V520 C700 640 610 708 512 748 C414 708 324 640 324 520 V360 Z" fill="url(#sh)" stroke="#E6E9EF" stroke-width="14"/>
    <path d="M512 330 L672 382 V520 C672 622 596 682 512 716 Z" fill="#FFFFFF" opacity=".08"/>
    <!-- 십자(보건) -->
    <path d="M488 560 h48 v-48 h0 z" fill="none"/>
    <!-- 안전모 -->
    <g transform="translate(512 520)">
      <path d="M-120 20 C-120 -70 -62 -118 0 -118 C62 -118 120 -70 120 20 Z" fill="url(#hat)" stroke="#8A4B00" stroke-width="6"/>
      <rect x="-14" y="-118" width="28" height="138" rx="8" fill="#FFE27A" opacity=".9"/>
      <rect x="-150" y="12" width="300" height="34" rx="17" fill="#F29A0E" stroke="#8A4B00" stroke-width="6"/>
      <!-- 녹십자 -->
      <rect x="-24" y="-72" width="48" height="16" rx="3" fill="#147A33"/><rect x="-8" y="-88" width="16" height="48" rx="3" fill="#147A33"/>
    </g>
    <!-- 체크 배지 -->
    <circle cx="512" cy="640" r="52" fill="#FFFFFF"/>
    <path d="M484 640 l20 20 l34 -40" stroke="#1E8B3A" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- 이름 -->
  <text x="512" y="868" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-weight="900" font-size="104" fill="#FFFFFF" letter-spacing="-2">안전보건 관리</text>
  <text x="512" y="938" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="44" fill="#C9D3F0" letter-spacing="3">SAFETY &amp; HEALTH MANAGEMENT</text>
</svg>
