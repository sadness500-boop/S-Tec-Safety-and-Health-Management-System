<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="-330 -20 1600 900">
  <!-- 에스텍 안전보건 관리 시스템 메인 히어로 — 사업장 안전 디오라마(TBM · 순찰 · 미화 · 점검 · 보호구) · Designed by Rat Rae Choi -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE6FF"/><stop offset="1" stop-color="#F4F7FF"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9EEF6"/><stop offset="1" stop-color="#D3DAE6"/></linearGradient>
    <linearGradient id="sideL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A44D4"/><stop offset="1" stop-color="#0B1F8A"/></linearGradient>
    <linearGradient id="sideR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B3AB0"/><stop offset="1" stop-color="#071463"/></linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD84A"/><stop offset="1" stop-color="#F29A0E"/></linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34C25C"/><stop offset="1" stop-color="#147A33"/></linearGradient>
    <filter id="sd" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0B1F8A" flood-opacity=".22"/></filter>
    <style>
      .float{animation:fl 4.5s ease-in-out infinite}
      .float2{animation:fl 5.5s ease-in-out infinite .8s}
      .blink{animation:bl 1.6s ease-in-out infinite}
      .walk{animation:wk 9s linear infinite}
      .pulse{animation:pu 2.8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
      @keyframes wk{0%{transform:translate(0,0)}50%{transform:translate(-120px,60px)}100%{transform:translate(0,0)}}
      @keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    </style>
  </defs>
  <rect x="-330" y="-20" width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1040" cy="120" r="70" fill="#FFFFFF" opacity=".7"/>
  <!-- 바닥 판(아이소메트릭) -->
  <g filter="url(#sd)">
    <path d="M600 250 L1110 510 L600 770 L90 510 Z" fill="url(#top)"/>
    <path d="M90 510 L600 770 L600 800 L90 540 Z" fill="url(#sideL)"/>
    <path d="M600 770 L1110 510 L1110 540 L600 800 Z" fill="url(#sideR)"/>
  </g>
  <!-- 바닥 안전선(노란 통로) -->
  <path d="M300 470 L760 705" stroke="#F2B90F" stroke-width="10" stroke-dasharray="26 16" opacity=".9"/>
  <path d="M420 410 L880 645" stroke="#F2B90F" stroke-width="10" stroke-dasharray="26 16" opacity=".9"/>
  <!-- 공장 건물 -->
  <g>
    <path d="M520 220 L740 330 L740 470 L520 360 Z" fill="#C9CDD3"/>
    <path d="M740 330 L900 250 L900 390 L740 470 Z" fill="#9AA3B2"/>
    <path d="M520 220 L680 140 L900 250 L740 330 Z" fill="#E6E9EF"/>
    <path d="M560 260 L600 280 L600 330 L560 310Z M620 290 L660 310 L660 360 L620 340Z M680 320 L720 340 L720 390 L680 370Z" fill="#2A44D4" opacity=".75"/>
    <rect x="820" y="160" width="28" height="110" fill="#9AA3B2"/><rect x="814" y="150" width="40" height="16" fill="#E34234"/>
    <circle class="float2" cx="834" cy="122" r="16" fill="#FFFFFF" opacity=".85"/><circle class="float" cx="852" cy="96" r="12" fill="#FFFFFF" opacity=".7"/>
    <!-- 녹십자 기 -->
    <rect x="575" y="120" width="5" height="110" fill="#5B6475"/>
    <path d="M580 122 h70 v46 h-70z" fill="#FFFFFF" stroke="#C9CDD3"/><rect x="603" y="140" width="24" height="10" fill="#1E8B3A"/><rect x="610" y="133" width="10" height="24" fill="#1E8B3A"/>
  </g>
  <!-- TBM 원(작업 전 회의) -->
  <g transform="translate(330 520)">
    <ellipse cx="0" cy="40" rx="120" ry="48" fill="#1E8B3A" opacity=".12"/>
    <g id="w">
      <ellipse cx="0" cy="34" rx="16" ry="6" fill="#0F1530" opacity=".18"/>
      <rect x="-12" y="-4" width="24" height="36" rx="9" fill="#2A44D4"/><rect x="-12" y="4" width="24" height="7" fill="#F2B90F"/>
      <circle cx="0" cy="-16" r="11" fill="#F6CBA7"/><path d="M-13 -18 a13 12 0 0 1 26 0z" fill="url(#hat)"/><rect x="-15" y="-19" width="30" height="4" rx="2" fill="#F29A0E"/>
    </g>
    <use href="#w" x="-80" y="10"/><use href="#w" x="-40" y="42"/><use href="#w" x="20" y="48"/><use href="#w" x="78" y="16"/><use href="#w" x="-20" y="-24"/><use href="#w" x="44" y="-20"/>
    <!-- 반장 + 태블릿 -->
    <g transform="translate(0 4)"><rect x="-6" y="-2" width="20" height="14" rx="3" fill="#0F1530"/><rect x="-4" y="0" width="16" height="10" rx="2" fill="#7FE0A0"/></g>
    <g transform="translate(-30 -110)"><g class="float">
      <rect x="0" y="0" width="150" height="46" rx="23" fill="#FFFFFF" filter="url(#sd)"/>
      <circle cx="24" cy="23" r="14" fill="#1E8B3A"/><path d="M17 23 l5 5 l9 -10" stroke="#FFF" stroke-width="4" fill="none" stroke-linecap="round"/>
      <text x="46" y="30" font-family="Noto Sans CJK KR, sans-serif" font-weight="800" font-size="20" fill="#0B1F8A">TBM 완료</text>
    </g></g>
  </g>
  <!-- 순찰 경비원(걷는 동작) -->
  <g class="walk"><g transform="translate(860 560)">
    <ellipse cx="0" cy="40" rx="18" ry="7" fill="#0F1530" opacity=".2"/>
    <rect x="-13" y="-4" width="26" height="42" rx="9" fill="#0B1F8A"/><rect x="-13" y="6" width="26" height="6" fill="#C9CDD3"/>
    <circle cx="0" cy="-18" r="12" fill="#F6CBA7"/><path d="M-14 -22 h28 v-6 a14 9 0 0 0 -28 0z" fill="#0B1F8A"/><rect x="-16" y="-23" width="32" height="5" rx="2" fill="#071463"/>
    <path d="M14 10 l22 -8" stroke="#E8E8E8" stroke-width="5" stroke-linecap="round"/><path d="M36 2 l40 -14 l0 24 z" fill="#FFF6B0" opacity=".55"/>
  </g></g>
  <!-- 미화원 + 미끄럼주의 표지 -->
  <g transform="translate(720 640)">
    <ellipse cx="0" cy="34" rx="16" ry="6" fill="#0F1530" opacity=".2"/>
    <rect x="-12" y="-6" width="24" height="38" rx="9" fill="#1E8B3A"/><circle cx="0" cy="-18" r="11" fill="#F6CBA7"/><path d="M-12 -21 a12 10 0 0 1 24 0z" fill="#147A33"/>
    <path d="M14 0 L40 34" stroke="#8A6B3F" stroke-width="5" stroke-linecap="round"/><rect x="30" y="32" width="24" height="8" rx="3" fill="#2A44D4"/>
    <ellipse cx="44" cy="44" rx="40" ry="12" fill="#7FB8FF" opacity=".35"/>
    <g transform="translate(-70 -6)"><path d="M0 40 L14 -4 L28 40" fill="none" stroke="#F2B90F" stroke-width="5"/><path d="M14 -4 L2 36 h24z" fill="#FFC62E"/><text x="14" y="26" text-anchor="middle" font-size="18" font-weight="900" fill="#1C2333">!</text></g>
  </g>
  <!-- 사다리 작업(2인 1조) -->
  <g transform="translate(980 470)">
    <path d="M0 60 L18 -40 M30 60 L44 -40" stroke="#9AA3B2" stroke-width="6"/>
    <path d="M4 40 h30 M8 20 h30 M12 0 h30 M15 -20 h30" stroke="#9AA3B2" stroke-width="5"/>
    <g transform="translate(-30 40)"><rect x="-10" y="-4" width="20" height="32" rx="8" fill="#E8750A"/><circle cx="0" cy="-15" r="10" fill="#F6CBA7"/><path d="M-11 -17 a11 10 0 0 1 22 0z" fill="url(#hat)"/></g>
    <text x="-14" y="128" font-family="Noto Sans CJK KR, sans-serif" font-size="15" font-weight="700" fill="#5B6475">2인 1조 · 사다리 고정</text>
  </g>
  <!-- 소화기 -->
  <g transform="translate(470 300)"><rect x="0" y="0" width="22" height="46" rx="8" fill="#E34234"/><rect x="5" y="-10" width="12" height="12" fill="#1C2333"/><path d="M17 -6 q18 0 18 18" stroke="#1C2333" stroke-width="4" fill="none"/></g>
  <!-- 떠 있는 카드: 위험성평가 · 점검 · 보호구 -->
  <g transform="translate(70 150)" filter="url(#sd)"><g class="float">
    <rect width="250" height="128" rx="18" fill="#FFFFFF"/>
    <text x="20" y="36" font-family="Noto Sans CJK KR, sans-serif" font-weight="800" font-size="20" fill="#0B1F8A">위험성평가</text>
    <g font-family="Noto Sans CJK KR, sans-serif" font-size="14" font-weight="700">
      <rect x="20" y="52" width="40" height="26" rx="6" fill="#E8F6EC"/><text x="40" y="70" text-anchor="middle" fill="#1B7A34">낮음</text>
      <rect x="68" y="52" width="40" height="26" rx="6" fill="#FFF4D6"/><text x="88" y="70" text-anchor="middle" fill="#B45309">보통</text>
      <rect x="116" y="52" width="40" height="26" rx="6" fill="#FFE1DC"/><text x="136" y="70" text-anchor="middle" fill="#C0392B">높음</text>
    </g>
    <rect x="20" y="92" width="210" height="12" rx="6" fill="#EEF1F5"/><rect x="20" y="92" width="168" height="12" rx="6" fill="url(#gr)"/>
    <text x="236" y="120" text-anchor="end" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#5B6475">감소대책 80%</text>
  </g></g>
  <g transform="translate(900 210)" filter="url(#sd)"><g class="float2">
    <rect width="230" height="118" rx="18" fill="#FFFFFF"/>
    <text x="20" y="36" font-family="Noto Sans CJK KR, sans-serif" font-weight="800" font-size="20" fill="#0B1F8A">안전점검</text>
    <g stroke-linecap="round" stroke-width="5" fill="none">
      <path d="M22 58 l7 7 l12 -14" stroke="#1E8B3A"/><path d="M52 58 h150" stroke="#DCE3F3"/>
      <path d="M22 84 l7 7 l12 -14" stroke="#1E8B3A"/><path d="M52 84 h120" stroke="#DCE3F3"/>
    </g>
    <circle class="blink" cx="200" cy="30" r="8" fill="#E34234"/>
  </g></g>
  <g transform="translate(110 640)" filter="url(#sd)"><g class="float">
    <rect width="190" height="100" rx="18" fill="#FFFFFF"/>
    <text x="18" y="34" font-family="Noto Sans CJK KR, sans-serif" font-weight="800" font-size="19" fill="#0B1F8A">보호구 지급</text>
    <path d="M30 80 a22 20 0 0 1 44 0z" fill="url(#hat)"/><rect x="24" y="78" width="56" height="7" rx="3" fill="#F29A0E"/>
    <path d="M100 56 h28 l6 30 h-40z" fill="#2A44D4"/><path d="M146 60 c10 0 22 8 22 26 h-34 c0 -12 2 -26 12 -26z" fill="#1C2333"/>
  </g></g>
  <!-- 방패 배지 -->
  <g transform="translate(420 40)"><g class="pulse">
    <path d="M40 0 L80 14 V48 C80 74 62 88 40 98 C18 88 0 74 0 48 V14 Z" fill="url(#gr)" stroke="#FFFFFF" stroke-width="5" filter="url(#sd)"/>
    <path d="M24 50 l11 11 l22 -24" stroke="#FFF" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g></g>
</svg>
