# index.html 이나 version.json 을 올리거나(main 브랜치) Actions 탭에서 직접 실행하면
# 안드로이드 앱(apk)을 만들어 아래 세 곳에 올립니다.
#   1) 저장소 releases/S-Tec-Safety-and-Health-Management-System_v{버전}.apk
#   2) 릴리스 v{버전}       (버전별 보관)
#   3) 릴리스 app-latest    (stsh-latest.apk — 앱 안의 「다운로드 QR › 안드로이드 앱」이 가리키는 주소)
# 서명은 android-keystore/stsh-debug.keystore 를 계속 써서, 새 버전을 지우지 않고 덮어 설치할 수 있습니다.
# Designed & Developed by Rat Rae Choi
name: Android APK

on:
  push:
    branches: [main]
    paths: [index.html, media/**, version.json, icons/**, capacitor.config.json, package.json, .github/workflows/android-apk.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: 버전 읽기
        id: ver
        run: |
          V=$(jq -r .version version.json)
          echo "v=$V" >> "$GITHUB_OUTPUT"
          IFS=. read -r MA MI PA <<< "$V"
          echo "code=$((MA*10000 + MI*100 + PA))" >> "$GITHUB_OUTPUT"
          echo "APK 버전 $V"

      - name: 웹 파일 준비
        run: |
          # 아이콘 도구(sharp)가 GitHub에서 libvips를 내려받다 일시 오류(504)가 나는 경우가 있어 재시도
          ok=0; for i in 1 2 3 4 5; do if npm install; then ok=1; break; fi; echo "npm install 재시도 $i"; rm -rf node_modules/sharp; sleep $((i*20)); done
          if [ $ok = 0 ]; then echo "::warning::sharp 설치 실패 — 스크립트 없이 설치"; npm install --ignore-scripts; fi
          npm run www

      - name: 안드로이드 프로젝트 만들기
        run: |
          npx cap add android
          mkdir -p assets && cp icons/app-icon-legacy-1024.png assets/icon-only.png && cp icons/app-icon-foreground-1024.png assets/icon-foreground.png
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"><rect width="1024" height="1024" fill="#0C2350"/></svg>' > assets/icon-background.svg
          npx capacitor-assets generate --android --iconBackgroundColor '#0C2350' --splashBackgroundColor '#0C2350' || true
          npx cap sync android

      - name: 버전 넣기
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.ver.outputs.code }}/; s/versionName \"[^\"]*\"/versionName \"${{ steps.ver.outputs.v }}\"/" "$G"
          grep -n "version" "$G"

      - name: apk 빌드 (고정 서명)
        working-directory: android
        run: |
          mkdir -p ~/.android && cp ../android-keystore/stsh-debug.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          V=${{ steps.ver.outputs.v }}
          mkdir -p ../releases
          cp app/build/outputs/apk/debug/app-debug.apk "../releases/S-Tec-Safety-and-Health-Management-System_v$V.apk"
          cp app/build/outputs/apk/debug/app-debug.apk ../stsh-latest.apk
          cp ../index.html "../releases/S-Tec-Safety-and-Health-Management-System_v$V.html"

      - uses: actions/upload-artifact@v4
        with:
          name: S-Tec-Safety-and-Health-Management-System_v${{ steps.ver.outputs.v }}
          path: releases/S-Tec-Safety-and-Health-Management-System_v${{ steps.ver.outputs.v }}.apk

      - name: 저장소 releases 폴더에 apk 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/S-Tec-Safety-and-Health-Management-System_v${{ steps.ver.outputs.v }}.apk" "releases/S-Tec-Safety-and-Health-Management-System_v${{ steps.ver.outputs.v }}.html"
          git commit -m "APK v${{ steps.ver.outputs.v }} 빌드 [skip ci]" || echo "변경 없음"
          git pull --rebase origin main && git push origin HEAD:main

      - name: 버전 릴리스 (v${{ steps.ver.outputs.v }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Safety & Health Management System v${{ steps.ver.outputs.v }}
          body: 안드로이드 앱 S-Tec-Safety-and-Health-Management-System_v${{ steps.ver.outputs.v }}.apk 와 웹 버전 HTML 입니다. 「출처를 알 수 없는 앱 설치」를 허용하고 설치하세요.
          files: |
            releases/S-Tec-Safety-and-Health-Management-System_v${{ steps.ver.outputs.v }}.apk
            releases/S-Tec-Safety-and-Health-Management-System_v${{ steps.ver.outputs.v }}.html
          make_latest: false

      - name: app-latest 태그를 이번 빌드로 옮기기
        run: |
          git tag -f app-latest HEAD
          git push -f origin refs/tags/app-latest

      - name: 최신판 릴리스 (QR 다운로드 주소)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: 에스텍 안전보건 관리 시스템 안드로이드 앱 (최신)
          body: 휴대폰에서 stsh-latest.apk 를 내려받아 설치하세요. 현재 버전 v${{ steps.ver.outputs.v }}. 「출처를 알 수 없는 앱」 안내가 나오면 이 출처 허용을 켜고 다시 설치합니다.
          files: |
            stsh-latest.apk
            releases/S-Tec-Safety-and-Health-Management-System_v${{ steps.ver.outputs.v }}.apk
          make_latest: true
